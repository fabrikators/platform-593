# Publishes the two walks and the photo map on GitHub Pages (https://fabrikators.github.io/platform-593/).
# Only the pages listed below are served; Madi's archive is never in the repository (.gitignore).
name: Publish the walks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gather the published pages
        run: |
          mkdir _site
          cp index.html walk2.html photos.html _site/
          cp -r css js data assets _site/
          rm -rf _site/assets/archive _site/assets/docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

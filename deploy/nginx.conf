# Platform 593: static site. Coolify routes HTTPS to this container's port 80.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json model/gltf+json image/svg+xml application/octet-stream;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # page, scripts and styles: always revalidate, so a redeploy shows at once
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # textures, models, sky: large and rarely changed
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location ~* \.gltf$ {
        types { } default_type model/gltf+json;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location ~* \.(hdr|bin)$ {
        types { } default_type application/octet-stream;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
